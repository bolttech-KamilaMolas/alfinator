<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALFinator — Admin Panel Historii</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #e0e0e0;
            padding: 2rem;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #00bac7; margin-bottom: 1rem; }
        h2 { color: #00bac7; margin-top: 2rem; margin-bottom: 1rem; }
        .section {
            background: #2a2a2a;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid #444;
        }
        button {
            background: #00bac7;
            color: #1e1e1e;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        button:hover { background: #009da8; }
        button.danger { background: #d92d20; color: #fff; }
        button.danger:hover { background: #b81f1f; }
        textarea {
            width: 100%;
            height: 300px;
            background: #1e1e1e;
            color: #00bac7;
            border: 1px solid #444;
            padding: 1rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }
        .output {
            background: #1e1e1e;
            border: 1px solid #444;
            padding: 1rem;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 1rem;
            font-size: 0.85rem;
        }
        .success { color: #039855; }
        .error { color: #d92d20; }
        .warning { color: #e3d900; }
        .info { color: #00bac7; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            border: 1px solid #444;
            padding: 0.75rem;
            text-align: left;
        }
        th { background: #333; color: #00bac7; }
        tr:nth-child(even) { background: #272727; }
        .loading { color: #e3d900; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 ALFinator — Admin Panel Historii</h1>
        
        <div class="section">
            <h2>📋 Bieżąca Historia</h2>
            <button onclick="viewCurrentHistory()">Pokaż historię bieżącą</button>
            <button onclick="exportHistory()">📥 Eksportuj do JSON</button>
            <div id="currentHistoryOutput" class="output"></div>
        </div>

        <div class="section">
            <h2>📊 Dziennik Audytu</h2>
            <button onclick="viewAuditLog()">Pokaż audit log</button>
            <div id="auditOutput" class="output"></div>
        </div>

        <div class="section">
            <h2>♻️ Przywróć Historię</h2>
            <p>Wklej JSON z poprzednią historią (uzyskany z "Eksportuj do JSON"):</p>
            <textarea id="historyInput" placeholder='{ "key1": { "name": "Alice", "date": "...", "timestamp": "..." }, ... }'></textarea>
            <button onclick="restoreHistoryFromInput()">✅ Przywróć Historię</button>
            <button class="danger" onclick="clearHistoryConfirm()">🗑️ Wyczyść Historię</button>
            <div id="restoreOutput" class="output"></div>
        </div>

        <div class="section">
            <h2>🔄 Dodaj Wpis Ręcznie</h2>
            <input type="text" id="personName" placeholder="Imię Nazwisko" style="width: 100%; padding: 0.5rem; margin-bottom: 0.5rem; background: #1e1e1e; color: #00bac7; border: 1px solid #444; border-radius: 4px;">
            <button onclick="addHistoryEntry()">➕ Dodaj do historii</button>
            <div id="addOutput" class="output"></div>
        </div>

        <div class="section">
            <h2>⚙️ Status Bazy</h2>
            <button onclick="checkDatabaseStatus()">Sprawdź połączenie</button>
            <div id="statusOutput" class="output"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD4-D3dN22UlqKc8-PLfdwQl83vmbdbh4s",
            authDomain: "alfinator.firebaseapp.com",
            databaseURL: "https://alfinator-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "alfinator",
            storageBucket: "alfinator.firebasestorage.app",
            messagingSenderId: "476621019100",
            appId: "1:476621019100:web:d4929e269c4abdf694e119"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function log(elementId, message, type = 'info') {
            const output = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString('pl-PL');
            const className = type;
            output.innerHTML += `<div class="${className}">[${timestamp}] ${escapeHtml(message)}</div>`;
            output.scrollTop = output.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function viewCurrentHistory() {
            const output = document.getElementById('currentHistoryOutput');
            output.innerHTML = '<div class="loading">Ładowanie...</div>';

            try {
                const snapshot = await db.ref('history/current').once('value');
                const data = snapshot.val();

                if (!data) {
                    output.innerHTML = '<div class="warning">Historia jest pusta</div>';
                    return;
                }

                let html = '<table><tr><th>Lp.</th><th>Imię Nazwisko</th><th>Data</th><th>Timestamp</th></tr>';
                let count = 1;
                Object.entries(data).forEach(([key, entry]) => {
                    html += `<tr>
                        <td>${count++}</td>
                        <td>${escapeHtml(entry.name)}</td>
                        <td>${escapeHtml(entry.date)}</td>
                        <td style="font-size: 0.75rem;">${escapeHtml(entry.timestamp)}</td>
                    </tr>`;
                });
                html += '</table>';

                output.innerHTML = `<div class="success">✓ Łącznie wpisów: ${count - 1}</div>${html}`;
            } catch (error) {
                log('currentHistoryOutput', `❌ Błąd: ${error.message}`, 'error');
            }
        }

        function exportHistory() {
            const output = document.getElementById('currentHistoryOutput');
            output.innerHTML = '<div class="loading">Eksportowanie...</div>';

            db.ref('history/current').once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    output.innerHTML = '<div class="warning">Historia jest pusta - nic do eksportu</div>';
                    return;
                }

                const json = JSON.stringify(data, null, 2);
                output.innerHTML = `<div class="success">✓ JSON Historii (skopiuj i zapisz):</div><textarea readonly>${escapeHtml(json)}</textarea>`;
            });
        }

        async function viewAuditLog() {
            const output = document.getElementById('auditOutput');
            output.innerHTML = '<div class="loading">Ładowanie...</div>';

            try {
                const snapshot = await db.ref('audit_log').once('value');
                const data = snapshot.val();

                if (!data) {
                    output.innerHTML = '<div class="warning">Audit log jest pusty</div>';
                    return;
                }

                let html = '<table><tr><th>Timestamp</th><th>Akcja</th><th>Szczegóły</th></tr>';
                Object.values(data).reverse().forEach(entry => {
                    html += `<tr>
                        <td style="font-size: 0.75rem;">${escapeHtml(entry.timestamp)}</td>
                        <td>${escapeHtml(entry.action)}</td>
                        <td>${entry.details ? escapeHtml(JSON.stringify(entry.details)) : '-'}</td>
                    </tr>`;
                });
                html += '</table>';

                output.innerHTML = `<div class="success">✓ Dziennik audytu:</div>${html}`;
            } catch (error) {
                log('auditOutput', `❌ Błąd: ${error.message}`, 'error');
            }
        }

        function restoreHistoryFromInput() {
            const input = document.getElementById('historyInput').value.trim();
            
            if (!input) {
                log('restoreOutput', 'Proszę wkleić JSON', 'error');
                return;
            }

            try {
                const data = JSON.parse(input);
                log('restoreOutput', 'Przywracam historię...', 'info');

                db.ref('history/current').set(data).then(() => {
                    log('restoreOutput', '✓ Historia przywrócona!', 'success');
                    log('restoreOutput', `Przywrócono ${Object.keys(data).length} wpisów`, 'success');
                    setTimeout(() => location.reload(), 2000);
                }).catch(err => {
                    log('restoreOutput', `Błąd Firebase: ${err.message}`, 'error');
                });
            } catch (err) {
                log('restoreOutput', `Błąd JSON: ${err.message}`, 'error');
            }
        }

        function clearHistoryConfirm() {
            if (confirm('⚠️ UWAGA! To wymaże CAŁĄ historię!\n\nNa pewno? (Nie można cofnąć!)')) {
                const output = document.getElementById('restoreOutput');
                output.innerHTML = '<div class="loading">Czyszczę...</div>';

                db.ref('history/current').remove().then(() => {
                    log('restoreOutput', '✓ Historia wyczyszczona!', 'success');
                    setTimeout(() => location.reload(), 1500);
                }).catch(err => {
                    log('restoreOutput', `Błąd: ${err.message}`, 'error');
                });
            }
        }

        function addHistoryEntry() {
            const name = document.getElementById('personName').value.trim();
            
            if (!name) {
                log('addOutput', 'Proszę wpisać imię i nazwisko', 'error');
                return;
            }

            const entry = {
                name: name,
                date: new Date().toLocaleDateString('pl-PL', {
                    weekday: 'long', day: 'numeric', month: 'long'
                }),
                timestamp: new Date().toISOString()
            };

            db.ref('history/current').push(entry).then(() => {
                log('addOutput', `✓ Dodano: ${name}`, 'success');
                document.getElementById('personName').value = '';
                setTimeout(() => viewCurrentHistory(), 500);
            }).catch(err => {
                log('addOutput', `Błąd: ${err.message}`, 'error');
            });
        }

        async function checkDatabaseStatus() {
            const output = document.getElementById('statusOutput');
            output.innerHTML = '<div class="loading">Sprawdzam...</div>';

            try {
                const timestamp = new Date().toISOString();
                await db.ref('.info/connected').once('value', (snapshot) => {
                    const isConnected = snapshot.val();
                    if (isConnected) {
                        log('statusOutput', '✓ Połączenie z Firebase: OK', 'success');
                    } else {
                        log('statusOutput', '❌ Brak połączenia z Firebase', 'error');
                    }
                });

                // Test write
                const testRef = db.ref('test-connection');
                await testRef.set({ timestamp: timestamp });
                log('statusOutput', '✓ Test zapisu: OK', 'success');

                // Read test
                const readSnapshot = await testRef.once('value');
                if (readSnapshot.exists()) {
                    log('statusOutput', '✓ Test odczytu: OK', 'success');
                }

                await testRef.remove();
                log('statusOutput', '✓ Połączenie z bazą danych sprawdzone!', 'success');
            } catch (error) {
                log('statusOutput', `❌ Błąd: ${error.message}`, 'error');
            }
        }

        // Load on startup
        document.addEventListener('DOMContentLoaded', () => {
            log('statusOutput', 'Panel gotów. Kliknij przycisk aby rozpocząć.', 'info');
        });
    </script>
</body>
</html>
